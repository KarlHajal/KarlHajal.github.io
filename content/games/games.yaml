- id: pillars
  title: "Pillars"
  year: 2017
  url: "https://karlhajal.com/Pillars/"
  description:
    - "A local 1v1 multiplayer game."
    - "Made for a game jam with Elie Maamary."
  controls:
    - "Player 1: WASD to move. G or left click shoots a fireball (hold to charge it). Left Shift locks your direction."
    - "Player 2: arrow keys to move. L shoots a fireball (hold to charge it). Right Alt locks your direction."

