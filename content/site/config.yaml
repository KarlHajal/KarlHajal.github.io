layout:
  header:
    navigation:
      - label: "Experience"
        href: "#timeline-heading"
      - label: "Publications"
        href: "#publications-heading"
      - label: "Projects"
        href: "#projects-heading"
      - label: "Music"
        href: "#music-heading"
      - label: "Games"
        href: "#games-heading"
      - label: "CV"
        href: "{{cv_path}}"
        is_external: true

  sections:
    projects:
      title: "Projects"
    music:
      title: "Original music"
    timeline:
      title: "Experience"
    media:
      title: "Highlights"
    publications:
      title: "Selected publications"
      note: "Please see my <a href=\"{{google_scholar_url}}\" target=\"_blank\">Google Scholar</a> for a complete list of publications."
    blog:
      title: "Writing"
      subtitle: ""

  footer:
    year: 2026
    license_text: "Template by Fabio J. Fehr"
    license_url: "https://github.com/FJFehr/fjfehr.github.io/"

contacts:
  - name: "Email"
    icon: "✉️"
    url: "mailto:karlhajal@gmail.com"
    display: "karlhajal@gmail.com"

  - name: "Google Scholar"
    icon: "content/site/icons/google-scholar-svgrepo-com.svg"
    url: "https://scholar.google.com/citations?user=EzN7CNAAAAAJ&hl=en"
    display: "Google Scholar"
    is_image: true

  - name: "LinkedIn"
    icon: "content/site/icons/linkedin-svgrepo-com.svg"
    url: "https://www.linkedin.com/in/karlhajal/"
    display: "LinkedIn"
    is_image: true

  - name: "GitHub"
    icon: "content/site/icons/github-svgrepo-com.svg"
    url: "https://github.com/KarlHajal"
    display: "GitHub"
    is_image: true

  - name: "ORCID"
    icon: "iD"
    url: "https://orcid.org/0000-0003-3128-335X"
    display: "ORCID"

design:
  layout:
    max_width: 1100px
    padding:
      horizontal: 40px
      vertical: 40px

  typography:
    body:
      font_size: 17px
      line_height: 1.6
      font_family: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif"
      color:
        light: "#0a0a0a"
        dark: "#e0e0e0"

    heading:
      name:
        font_size: 32px
        font_weight: 700
        letter_spacing: "-0.02em"
      section_title:
        font_size: 28px
        font_weight: 700

    links:
      font_size: 14px
      color:
        light: "#666"
        dark: "#a0a0a0"

  spacing:
    header:
      margin_top: 70px
      margin_bottom: 70px
    profile_section:
      margin_top: 40px
      margin_bottom: 40px
      gap: 16px
    publication_section:
      margin_top: 40px
      margin_bottom: 40px
      publication_margin_bottom: 12px
    contact_section:
      margin_top: 40px
      margin_bottom: 40px
    footer:
      margin_top: 60px
      padding_bottom: 40px

  images:
    profile_picture:
      width: 180px
      border_radius: "50%"
    publication_thumbnail:
      width: 180px
      height: 180px
      border_radius: "6px"

  social_links:
    button:
      size: 32px
      border_radius: "50%"
    icon:
      width: 18px
      height: 18px
      font_size: 20px
    gap: 12px
    spacing:
      margin_top: 16px

  colors:
    active_palette: "violet"

    palettes:
      indigo:
        light: { link: "#4f46e5", hover: "#e0e7ff" }
        dark:  { link: "#818cf8", hover: "#2d2a5e" }
      violet:
        light: { link: "#7c3aed", hover: "#ede9fe" }
        dark:  { link: "#a78bfa", hover: "#2e1065" }
      teal:
        light: { link: "#0d9488", hover: "#ccfbf1" }
        dark:  { link: "#2dd4bf", hover: "#042f2e" }

    light_mode:
      background: "#f8f5ee"
      surface: "#f8f5ee"
      text: "#0a0a0a"
      muted: "#666"
      border: "#e0e0e0"

    dark_mode:
      background: "#1a1a1a"
      surface: "#2a2a2a"
      text: "#e0e0e0"
      muted: "#a0a0a0"
      border: "#333"

    accent:
      light: { base: "#f59e0b", hover: "#fef3c7" }
      dark:  { base: "#fbbf24", hover: "#451a03" }

  transitions:
    duration: "0.2s"
    easing: "ease"
